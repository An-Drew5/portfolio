name: CI & Quality Gate

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Next.js production build
        run: npm run build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO_EMAIL: andrewoppong123@gmail.com
          CONTACT_FROM_EMAIL: onboarding@resend.dev

  open-pull-request:
    name: Open development-to-main pull request
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or reuse pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr=$(gh pr list --base main --head development --state open --json url --jq '.[0].url')
          if [ -n "$existing_pr" ]; then
            echo "Pull request already open: $existing_pr"
            exit 0
          fi

          ahead_by=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...development" --jq '.ahead_by')
          if [ "$ahead_by" -eq 0 ]; then
            echo "No development commits to propose for main."
            exit 0
          fi

          gh pr create \
            --base main \
            --head development \
            --title "Merge development into main" \
            --body "Automated pull request from development to main after CI validation passed. Please review and merge when ready."
